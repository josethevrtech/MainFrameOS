# Initial profile. Speaker routes are intentionally unavailable until protection is integrated.
SectionVerb {
    EnableSequence [
        cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
        cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
        cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
        cset "name='MultiMedia4 Mixer VA_CODEC_DMA_TX_0' 1"
    ]
    DisableSequence [
        cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
        cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
        cset "name='MultiMedia4 Mixer VA_CODEC_DMA_TX_0' 0"
    ]
    Value { TQ "HiFi" }
}
SectionDevice."Headphones" {
    Comment "Headphones"
    Include.codecEnable.File "/codecs/wcd938x/HeadphoneABEnableSeq.conf"
    Include.codecDisable.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
    Include.macroEnable.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
    Include.macroDisable.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"
    Value {
        PlaybackPriority 200
        PlaybackPCM "hw:${CardId},0"
        PlaybackMixer "default:${CardId}"
        PlaybackMixerElem "HP"
        JackControl "Headphone Jack"
    }
}
SectionDevice."Headset" {
    Comment "Headset microphone"
    Include.codecEnable.File "/codecs/wcd938x/HeadphoneMicEnableSeq.conf"
    Include.codecDisable.File "/codecs/wcd938x/HeadphoneMicDisableSeq.conf"
    Include.macroEnable.File "/codecs/qcom-lpass/tx-macro/SoundwireMic1EnableSeq.conf"
    Include.macroDisable.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"
    Value {
        CapturePriority 200
        CapturePCM "hw:${CardId},2"
        CaptureMixerElem "ADC2"
        JackControl "Mic Jack"
    }
}
SectionDevice."Mic" {
    Comment "Internal microphones"
    Include.dmic0Enable.File "/codecs/qcom-lpass/va-macro/DMIC0EnableSeq.conf"
    Include.dmic0Disable.File "/codecs/qcom-lpass/va-macro/DMIC0DisableSeq.conf"
    Include.dmic1Enable.File "/codecs/qcom-lpass/va-macro/DMIC1EnableSeq.conf"
    Include.dmic1Disable.File "/codecs/qcom-lpass/va-macro/DMIC1DisableSeq.conf"
    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId},3"
        CaptureChannels 2
    }
}
